# Regenera catalogo.pdf cada vez que el centro de control cambia el estado de un artículo.
name: Regenerar PDF
on:
  push:
    branches: [main]
    paths: [estado.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pdf
  cancel-in-progress: true
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q qrcode pillow
      - run: sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null
      - run: python tools/build.py --ci .
      - name: Subir PDF
        run: |
          git config user.name "venta-bot"
          git config user.email "venta-bot@users.noreply.github.com"
          git add catalogo.pdf pdf.json
          git diff --cached --quiet && exit 0
          git commit -q -m "PDF regenerado"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
